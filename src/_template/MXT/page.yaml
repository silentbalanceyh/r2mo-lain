# ============================================================================
# @METADATA / 页面元数据
# 描述：页面的基本信息定义
# ============================================================================
metadata:
  name: page-name
  title: 页面标题
  description: 页面描述
  version: 1.0.0
  authorized: true | false

# ============================================================================
# @DICT / 数据字典配置
# 描述：页面所需的业务字典定义
# ============================================================================
dict:
  - dict-name-01
  - dict-name-02

# ============================================================================
# @LAYOUT / 页面布局配置
# 描述：页面的UI布局和组件结构
# ============================================================================
layout:
  - component: layout-01
    config: {}
  - component: layout-02
    config: {}

# ============================================================================
# @LIFECYCLE / 页面生命周期
# ============================================================================

# 初始化阶段 (INIT PHASE)
# 描述：页面加载和初始化时执行，用于准备页面数据和状态
# ============================================================================
init:
  - init-01
  - init-02

# 交互阶段 (ACTION PHASE)
# 描述：页面用户交互时触发的动作，包括业务逻辑和状态流转
# ============================================================================
action:
  - name: action-01
    next: ???
  - name: action-02
    next: ???

# 验证阶段 (VALIDATE PHASE)
# 描述：对用户输入或页面数据进行验证
# ============================================================================
validate:
  - validate-01
  - validate-02

# 事件处理阶段 (EVENT PHASE)
# 描述：页面事件监听和处理逻辑
# ============================================================================
event:
  - name: event-01
    handler: handler-01
  - name: event-02
    handler: handler-02

# 清理阶段 (CLEANUP PHASE)
# 描述：页面卸载前的清理操作，释放资源
# ============================================================================
cleanup:
  - cleanup-01
  - cleanup-02